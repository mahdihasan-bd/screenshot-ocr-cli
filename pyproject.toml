[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr2text"
version = "0.1.0"
description = "Extract text from screenshots and images via the OCR.space API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ocr", "screenshot", "cli"]

[project.scripts]
ocr2text = "ocr2text.__main__:main"
